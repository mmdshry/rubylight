<!doctype html>
<html lang="fa" dir="rtl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>جواهری روبی لایت | بازار بزرگ تهران</title>
    <meta
      name="description"
      content="جواهری روبی لایت — پاساژ خرداد، بازار بزرگ تهران. تماس ۰۹۱۲۷۲۱۷۰۸۱"
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <link rel="canonical" href="https://rubylight.ir/" />
    <link rel="alternate" hreflang="fa" href="https://rubylight.ir/?lang=fa" />
    <link rel="alternate" hreflang="en" href="https://rubylight.ir/?lang=en" />
    <link rel="alternate" hreflang="x-default" href="https://rubylight.ir/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="جواهری روبی لایت | بازار بزرگ تهران" />
    <meta
      property="og:description"
      content="جواهری روبی لایت — پاساژ خرداد، بازار بزرگ تهران."
    />
    <meta property="og:url" content="https://rubylight.ir/" />
    <meta property="og:image" content="https://rubylight.ir/brand/og.png" />
    <meta property="og:locale" content="fa_IR" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ruby Light" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #fff;
        color: #5c0a1a;
      }
      html[data-tv='1'],
      html[data-tv='1'] body,
      html[data-tv='1'] #root {
        height: 100%;
        background: #ffffff;
        color: #5c0a1a;
      }
    </style>
    <script>
      (function () {
        try {
          var path = (location.pathname || '').replace(/\/+$/, '')
          var isTv = path === '/tv'
          var root = document.documentElement
          if (isTv) {
            root.lang = 'fa'
            root.dir = 'rtl'
            root.setAttribute('data-tv', '1')
            root.setAttribute('data-theme', 'light')
            document.title = 'تابلو قیمت طلا | روبی لایت'
            var robots = document.querySelector('meta[name="robots"]')
            if (robots) robots.setAttribute('content', 'noindex, nofollow')
            return
          }
          var q = new URLSearchParams(location.search).get('lang')
          var saved = localStorage.getItem('ruby-light-locale')
          var lang =
            q === 'en' || q === 'fa'
              ? q
              : saved === 'en' || saved === 'fa'
                ? saved
                : 'fa'
          root.lang = lang
          root.dir = lang === 'fa' ? 'rtl' : 'ltr'
          root.dataset.theme = 'light'
          var href = '/brand/logo-hero.webp'
          var link = document.createElement('link')
          link.rel = 'preload'
          link.as = 'image'
          link.href = href
          link.type = 'image/webp'
          link.fetchPriority = 'high'
          document.head.appendChild(link)
          window.__RUBY_LOGO__ = href
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
