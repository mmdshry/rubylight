<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>جواهری روبی لایت | بازار بزرگ تهران</title>
    <meta
      name="description"
      content="جواهری روبی لایت — پاساژ خرداد، بازار بزرگ تهران. تماس ۰۹۱۲۷۲۱۷۰۸۱"
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#5C0A1A" />
    <meta name="color-scheme" content="light dark" />
    <link rel="canonical" href="https://rubylight.ir/" />
    <link rel="alternate" hreflang="fa" href="https://rubylight.ir/?lang=fa" />
    <link rel="alternate" hreflang="en" href="https://rubylight.ir/?lang=en" />
    <link rel="alternate" hreflang="x-default" href="https://rubylight.ir/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="جواهری روبی لایت | بازار بزرگ تهران" />
    <meta
      property="og:description"
      content="جواهری روبی لایت — پاساژ خرداد، بازار بزرگ تهران."
    />
    <meta property="og:url" content="https://rubylight.ir/" />
    <meta property="og:image" content="https://rubylight.ir/brand/og.png" />
    <meta property="og:locale" content="fa_IR" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #5c0a1a;
        color: #fff;
      }
      html[data-theme='light'],
      html[data-theme='light'] body {
        background: #fff;
        color: #5c0a1a;
      }
      #hero-logo-fallback {
        position: fixed;
        left: 50%;
        top: calc(50% - 9.5rem);
        transform: translateX(-50%);
        width: clamp(7.5rem, 28vw, 11rem);
        height: auto;
        z-index: 1;
        pointer-events: none;
      }
    </style>
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('lang')
          var saved = localStorage.getItem('ruby-light-locale')
          var lang =
            q === 'en' || q === 'fa'
              ? q
              : saved === 'en' || saved === 'fa'
                ? saved
                : 'fa'
          var dark = lang !== 'en'
          document.documentElement.lang = lang
          document.documentElement.dir = dark ? 'rtl' : 'ltr'
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          var href = dark
            ? '/brand/logo-light-hero.webp'
            : '/brand/logo-hero.webp'
          var link = document.createElement('link')
          link.rel = 'preload'
          link.as = 'image'
          link.href = href
          link.type = 'image/webp'
          link.fetchPriority = 'high'
          document.head.appendChild(link)
          window.__RUBY_LOGO__ = href
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <img
      id="hero-logo-fallback"
      width="224"
      height="224"
      alt="جواهری روبی لایت"
      fetchpriority="high"
      decoding="sync"
    />
    <script>
      document.getElementById('hero-logo-fallback').src =
        window.__RUBY_LOGO__ || '/brand/logo-light-hero.webp'
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
